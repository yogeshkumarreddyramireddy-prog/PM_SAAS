name: Process Cloud Optimized GeoTIFF (COG)

on:
  workflow_dispatch:
    inputs:
      file_id:
        description: 'Content file ID from Supabase'
        required: true
        type: string
      r2_key:
        description: 'R2 object key of the uploaded Multispectral TIFF'
        required: true
        type: string
      golf_course_id:
        description: 'Golf course ID (integer)'
        required: true
        type: string
      golf_course_name:
        description: 'Golf course name (sanitized)'
        required: true
        type: string

# Least-privilege token: this workflow only reads the repo checkout.
permissions:
  contents: read

jobs:
  process-cog:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Significantly faster than PNG tiling

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate workflow inputs
        env:
          FILE_ID: ${{ inputs.file_id }}
          GOLF_COURSE_ID: ${{ inputs.golf_course_id }}
          COURSE_NAME: ${{ inputs.golf_course_name }}
          R2_KEY: ${{ inputs.r2_key }}
        run: |
          # Fail fast on malformed/hostile inputs before any work or secret use.
          # Every untrusted value is consumed via env below (never interpolated
          # into a run: script), so these checks are defence-in-depth.
          echo "$FILE_ID" | grep -Eq '^[0-9a-fA-F-]{36}$' || { echo "Invalid file_id"; exit 1; }
          echo "$GOLF_COURSE_ID" | grep -Eq '^[0-9]+$'    || { echo "Invalid golf_course_id"; exit 1; }
          case "$COURSE_NAME" in ''|*/*|*..*) echo "Invalid golf_course_name"; exit 1;; esac
          case "$R2_KEY"      in ''|*..*)     echo "Invalid r2_key"; exit 1;; esac

      - name: Install GDAL and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal python3-pip
          pip3 install boto3 requests

      - name: Configure R2 Access
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id=${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key=${{ secrets.R2_SECRET_ACCESS_KEY }}
          EOF
          cat > ~/.aws/config << EOF
          [default]
          region = auto
          EOF

      - name: Download Raw TIFF from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_KEY: ${{ inputs.r2_key }}
        run: |
          echo "Downloading: $R2_KEY"
          aws s3 cp \
            "s3://$R2_BUCKET/$R2_KEY" \
            /tmp/input.tif \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Extract Geospatial Metadata
        id: metadata
        run: |
          # Reusing your existing awesome python extraction script
          python3 scripts/extract_metadata.py /tmp/input.tif > /tmp/metadata.json
          BOUNDS=$(python3 -c 'import json; m=json.load(open("/tmp/metadata.json")); print(json.dumps(m["bounds"]))')
          CENTER_LAT=$(python3 -c 'import json; m=json.load(open("/tmp/metadata.json")); print(m["center_lat"])')
          CENTER_LON=$(python3 -c 'import json; m=json.load(open("/tmp/metadata.json")); print(m["center_lon"])')
          # Validate as single-line numeric / JSON-array before writing to
          # GITHUB_OUTPUT, so a hostile TIFF cannot inject extra output lines.
          echo "$BOUNDS" | python3 -c 'import json,sys; a=json.load(sys.stdin); assert isinstance(a,list) and all(isinstance(x,(int,float)) for x in a)' || { echo "Invalid bounds"; exit 1; }
          case "$CENTER_LAT" in ''|*[!0-9.eE+-]*) echo "Invalid center_lat"; exit 1;; esac
          case "$CENTER_LON" in ''|*[!0-9.eE+-]*) echo "Invalid center_lon"; exit 1;; esac
          {
            echo "bounds=$BOUNDS"
            echo "center_lat=$CENTER_LAT"
            echo "center_lon=$CENTER_LON"
          } >> "$GITHUB_OUTPUT"

      - name: Reproject to WGS84 (EPSG:4326) and convert to COG
        run: |
          # Reproject to EPSG:4326 (geographic lon/lat). This makes the COG
          # north-up so the client places it with an axis-aligned bounding box
          # that lines up exactly with the basemap, and — crucially — its
          # coordinates are plain lon/lat degrees that the client recognises
          # directly as WGS84.
          #
          # Why NOT keep native UTM: a UTM grid is rotated ~1-3deg from geographic
          # north (meridian convergence). Placing such an image in a north-aligned
          # lon/lat box skews it against the basemap AND makes the low-res "base"
          # and high-res "window" overlay layers disagree at the edges (a blocky
          # fringe next to the sharp interior).
          #
          # Why NOT 3857: although 3857 is north-up, its coordinates are large
          # metre values (e.g. easting ~690000). The client's CRS auto-detect
          # mistook those for UTM and reprojected the image to the wrong place
          # (the Baltic Sea). 4326's degree coordinates avoid that entirely.
          #
          # Resolution: EPSG:4326 re-grids onto a lon/lat grid; left to choose its
          # own size, gdalwarp dropped ~30% of the rows last time. We pin the
          # output to the EXACT source pixel dimensions (-ts W H) so no resolution
          # is lost. The pixels become non-square in degrees but are square on the
          # ground (correct), and the geographic bounds remain exact.
          SRC_W=$(gdalinfo -json /tmp/input.tif | python3 -c "import json,sys; print(json.load(sys.stdin)['size'][0])")
          SRC_H=$(gdalinfo -json /tmp/input.tif | python3 -c "import json,sys; print(json.load(sys.stdin)['size'][1])")
          echo "Source size: ${SRC_W}x${SRC_H}px — reprojecting to EPSG:4326 at matching size..."
          # -r near (not bilinear): preserves exact DN values and does NOT blend
          # real reflectance with the 0-border at the footprint edge — that blend
          # biased every edge zone's stats. -srcnodata/-dstnodata 0 mark the
          # transparent border as nodata so it's excluded from the COG and indices.
          gdalwarp \
            -t_srs EPSG:4326 \
            -r near \
            -ts "$SRC_W" "$SRC_H" \
            -srcnodata 0 -dstnodata 0 \
            -of GTiff \
            -co BIGTIFF=YES \
            /tmp/input.tif \
            /tmp/reprojected.tif

          echo "Converting reprojected TIFF to Cloud Optimized GeoTIFF..."
          # PREDICTOR=2 = horizontal differencing for INTEGER data. The bands are
          # UInt16 DN, so the old PREDICTOR=YES was invalid (silently ignored) and
          # PREDICTOR=3 would be wrong too — that's the floating-point predictor.
          gdal_translate /tmp/reprojected.tif /tmp/output_cog.tif \
            -of COG \
            -co COMPRESS=DEFLATE \
            -co PREDICTOR=2 \
            -co RESAMPLING=AVERAGE \
            -co OVERVIEWS=IGNORE_EXISTING \
            -co BIGTIFF=YES

          echo "Size comparison:"
          ls -lh /tmp/input.tif /tmp/reprojected.tif /tmp/output_cog.tif

      - name: Upload Single COG to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          COURSE_NAME: ${{ inputs.golf_course_name }}
          FILE_ID: ${{ inputs.file_id }}
        run: |
          # Note: We save it strictly as a single file instead of a folder array
          R2_DESTINATION="${COURSE_NAME}/cogs/${FILE_ID}.tif"

          echo "Uploading Single COG to R2: ${R2_DESTINATION}"

          aws s3 cp \
            /tmp/output_cog.tif \
            "s3://$R2_BUCKET/${R2_DESTINATION}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --content-type "image/tiff"

      - name: Register COG in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COURSE_NAME: ${{ inputs.golf_course_name }}
          FILE_ID: ${{ inputs.file_id }}
          GOLF_COURSE_ID: ${{ inputs.golf_course_id }}
          BOUNDS: ${{ steps.metadata.outputs.bounds }}
          CENTER_LAT: ${{ steps.metadata.outputs.center_lat }}
          CENTER_LON: ${{ steps.metadata.outputs.center_lon }}
        run: |
          R2_DESTINATION="${COURSE_NAME}/cogs/${FILE_ID}.tif"
          echo "Registering COG: ${R2_DESTINATION}"

          # Build the request body with jq so every value is passed as data,
          # never spliced into the request text (no command / JSON injection).
          PAYLOAD=$(jq -n \
            --arg     fileId       "$FILE_ID" \
            --arg     golfCourseId "$GOLF_COURSE_ID" \
            --arg     r2Key        "$R2_DESTINATION" \
            --arg     courseName   "$COURSE_NAME" \
            --argjson bounds       "$BOUNDS" \
            --argjson centerLat    "$CENTER_LAT" \
            --argjson centerLon    "$CENTER_LON" \
            '{fileId:$fileId, golfCourseId:$golfCourseId, r2Key:$r2Key, courseName:$courseName, bounds:$bounds, centerLat:$centerLat, centerLon:$centerLon, minZoom:14, maxZoom:20}')

          REGISTER_RESULT=$(curl -s -w "\n%{http_code}" -X POST "${SUPABASE_URL}/functions/v1/r2-complete-cog" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_STATUS=$(echo "$REGISTER_RESULT" | tail -1)
          BODY=$(echo "$REGISTER_RESULT" | head -n -1)
          echo "Register response (${HTTP_STATUS}): ${BODY}"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Failed to register COG tileset (HTTP ${HTTP_STATUS})"
            exit 1
          fi

          echo "COG registered successfully"

      - name: Update content file status to published
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FILE_ID: ${{ inputs.file_id }}
          COURSE_NAME: ${{ inputs.golf_course_name }}
        run: |
          TILED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          R2_DESTINATION="${COURSE_NAME}/cogs/${FILE_ID}.tif"

          UPDATE_RESULT=$(curl -s -w "\n%{http_code}" -X PATCH "${SUPABASE_URL}/rest/v1/content_files?id=eq.${FILE_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"published\",
              \"is_tile_map\": true,
              \"metadata\": {\"cog_complete\": true, \"cog_key\": \"${R2_DESTINATION}\", \"tiled_at\": \"${TILED_AT}\"}
            }")

          HTTP_STATUS=$(echo "$UPDATE_RESULT" | tail -1)
          BODY=$(echo "$UPDATE_RESULT" | head -n -1)
          echo "Update response (${HTTP_STATUS}): ${BODY}"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "WARNING: Failed to update content file status (HTTP ${HTTP_STATUS})"
          else
            echo "Content file status updated to 'published'"
          fi
